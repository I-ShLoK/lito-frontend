    <rect x="38" y="38" width="436" height="436" rx="104" fill="none" stroke="#98a4b41f" stroke-width="3"/>
    <rect x="51" y="51" width="410" height="410" rx="92" fill="none" stroke="#ffffff22" stroke-width="1.5"/>
  </g>

  <g clip-path="url(#iconClip)">
