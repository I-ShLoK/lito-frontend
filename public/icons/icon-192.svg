      <feDropShadow dx="0" dy="3" stdDeviation="2.4" flood-color="#02050a" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="0.6" flood-color="#ffffff" flood-opacity="0.2"/>
    </filter>
    <clipPath id="iconClip">
      <rect x="38" y="38" width="436" height="436" rx="104"/>
