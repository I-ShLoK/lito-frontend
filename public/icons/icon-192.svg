    <path d="M66 94C120 52 213 36 305 50c67 10 117 34 141 62v70c-25-41-77-67-146-75-97-11-195 17-234 67z" fill="url(#glassSheen)" opacity="0.9"/>
    <ellipse cx="252" cy="238" rx="232" ry="180" fill="none" stroke="#9fb4cc1f" stroke-width="28"/>
    <ellipse cx="252" cy="238" rx="188" ry="144" fill="none" stroke="#b8c4d118" stroke-width="10"/>
